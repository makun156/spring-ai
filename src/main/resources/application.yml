spring:
  application:
    name: spring-ai
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  ai:
    openai:
      api-key: sk-7b12f7f5607d424eb1efce4a8ef93492
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.7-plus
        extra-body:
          enable_thinking: false
      embedding:
        model: text-embedding-v4
        dimensions: 1024
    milvus:
      client:
        host: localhost
        port: 19530
    vectorstore:
      milvus:
        database-name: default
        collection-name: spring_ai_store
        initialize-schema: true
        embedding-dimension: 1024

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
