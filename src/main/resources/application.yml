spring:
  application:
    name: spring-ai
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  ai:
    openai:
      api-key: sk-7b12f7f5607d424eb1efce4a8ef93492
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      chat:
        model: qwen3.7-plus
        extra-body:
          enable_thinking: false
    deepseek:
      chat:
        model: deepseek-v4-flash
        extra-body:
          enable_thinking: false
      api-key: sk-7b12f7f5607d424eb1efce4a8ef93492
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
